<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e8">
  <meta name="description" content="拉弓、瞄准、松手！拟物化弹弓飞镖小游戏，支持电脑和手机。重击碎盘，积镖掉落。">
  <title>弹弓飞镖 · 拉满，来一发</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15"/><circle cx="20" cy="20" r="8"/><circle cx="20" cy="20" r="2"/><path d="M21 19 34 6m-6 0h6v6"/></svg></div>
        <div><h1>弹弓飞镖<span class="edition">自由投掷</span></h1><p>THE SLINGSHOT CLUB</p></div>
      </div>
      <div class="header-actions">
        <button id="sound" class="icon-button" aria-label="关闭声音" aria-pressed="true" title="关闭声音"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4 6 8H3v8h3l5 4V4Z"/><path class="sound-waves" d="M15 8c3 2 3 6 0 8m3-11c5 4 5 10 0 14"/></svg></button>
        <button id="restart" class="button secondary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 0 5M4 4v6h6"/></svg><span>重新开始</span></button>
      </div>
    </header>

    <section class="arena" aria-label="弹弓飞镖游戏">
      <canvas id="game" aria-label="拖动屏幕下方弹弓，松手发射飞镖。也可以用方向键调整，空格键发射。" tabindex="0"></canvas>
      <div class="scoreboard">
        <p class="eyebrow">总得分 <span>TOTAL SCORE</span></p>
        <div class="score-number" id="score">0</div>
        <div class="score-details"><span>投掷 <b id="shots">0</b></span><span>命中 <b id="accuracy">—</b></span></div>
      </div>
      <div class="board-counter"><div><span class="live-dot"></span>盘上飞镖 <strong id="darts">0</strong></div></div>
      <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
      <div class="power-panel">
        <div class="power-label"><span>拉弓力度</span><strong id="power-value">0<span>%</span></strong></div>
        <div class="power-track"><div id="power-fill"></div><i></i></div>
        <p id="power-hint">拉住弹弓，向后拖动</p>
      </div>
      <div class="pull-hint" id="pull-hint"><svg viewBox="0 0 28 34" aria-hidden="true"><path d="M14 2v26M5 20l9 9 9-9"/></svg><span>往后拉，松手发射</span></div>
      <button id="replace" class="button replace-button" title="换个靶盘，切换头像样式"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v8m-4-4h8"/></svg>换个靶盘</button>
      <div class="loading" id="loading">正在挂上靶盘…</div>
    </section>

    <footer class="guide">
      <div class="guide-intro"><span class="mini-target" aria-hidden="true">◎</span><div><strong>拉满，来一发。</strong><p>往后拉出力度，调整方向，松手试试准头。</p></div></div>
      <div class="rules"><span><i class="rule-dot bull"></i>靶心 <b>50分</b></span><span><i class="rule-dot normal"></i>盘面 <b>10分</b></span><span><i class="rule-dot smash"></i>红色外框 <b>5分</b></span><span><i class="rule-dot fall"></i>300%力度 <b>碎盘</b></span></div>
    </footer>
    <p class="footnote">随便投，尽情玩 <span>·</span> 飞偏了也没关系 <span class="keyboard-note"> / 方向键调整 · 空格发射</span></p>
    <noscript><p class="noscript">请开启浏览器的 JavaScript 来玩弹弓飞镖。</p></noscript>
  </main>
  <script type="module" src="./game.js?v=2"></script>
</body>
</html>
